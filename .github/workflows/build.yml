name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: unzip -q FocusLock-project.zip
      - run: |
          if [ -f motivation.mp4 ]; then cp motivation.mp4 FocusLock/app/src/main/res/raw/; fi
      - run: gradle assembleDebug -p FocusLock
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: FocusLock/app/build/outputs/apk/debug/app-debug.apk
